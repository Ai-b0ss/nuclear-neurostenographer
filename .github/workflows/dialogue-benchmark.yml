name: Tiny acted Russian dialogue evaluation (not corpus accuracy)
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "development (threshold sweep) or disjoint holdout (production only)"
        type: choice
        required: true
        default: development
        options:
          - development
          - holdout
  push:
    branches: ['codex/**']
    paths: ['.github/workflows/dialogue-benchmark.yml', 'tools/*dialogue_benchmark*', 'tools/run_android_benchmark.sh', 'tools/score_transcript.py', 'tools/fixtures/dialogs-ru-smoke-lock.json', 'tools/fixtures/dialogs-ru-disjoint-holdout-lock.json', 'tools/runtime/runtime.properties', 'app/src/benchmarkTest/**', 'app/src/main/**', 'app/build.gradle.kts', 'core/src/**']
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      BENCHMARK_SUITE: ${{ inputs.suite || 'development' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare pinned public models and externally annotated acted fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/test_dialogue_benchmark.py
          python3 tools/provision_asr.py --test-assets
          python3 tools/provision_diarization.py --test-assets
          python3 tools/provision_dialogue_benchmark.py --suite "$BENCHMARK_SUITE"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M
          script: bash tools/run_android_benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acted-russian-evaluation-no-audio
          path: |
            .local/dialogue-benchmark/*.json
            .local/dialogue-benchmark/LICENSE.md
            .local/runtime-selection.json
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
      - name: Expose measurements and quality failures separately from execution
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('.local/dialogue-benchmark/scores.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f'### {os.environ.get("BENCHMARK_SUITE", "development")} acted Russian evaluation: execution is not accuracy acceptance\n\n')
              if not path.is_file():
                  out.write('No score file: evaluation did not complete.\n')
              else:
                  score = json.loads(path.read_text())
                  out.write('Not a representative corpus. Holdout is disjoint from development but still acted. DER has no independent speech-boundary reference.\n\n')
                  for name in ['wer', 'cpwer', 'der', 'recurrence_probe']:
                      out.write(f'- {name}: `{json.dumps(score.get(name), ensure_ascii=False)}`\n')
                  out.write('\nNo competition accuracy threshold is defined. Read the attached license and scope.\n')
          PY
