name: Tiny acted Russian dialogue evaluation (not corpus accuracy)
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths: ['.github/workflows/dialogue-benchmark.yml', 'tools/*dialogue_benchmark*', 'tools/fixtures/dialogs-ru-smoke-lock.json', 'app/src/benchmarkTest/**']
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare pinned public models and externally annotated acted fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/test_dialogue_benchmark.py
          python3 tools/provision_asr.py --test-assets
          python3 tools/provision_diarization.py --test-assets
          python3 tools/provision_dialogue_benchmark.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M
          script: bash tools/run_android_benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acted-russian-evaluation-no-audio
          path: |
            .local/dialogue-benchmark/*.json
            .local/dialogue-benchmark/LICENSE.md
            .local/runtime-selection.json
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
