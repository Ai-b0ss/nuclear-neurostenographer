name: Host JNI inference and overlap regression (not Android)
on:
  workflow_dispatch:
  push:
    branches: ['codex/**']
    paths: ['.github/workflows/host-inference.yml', 'tools/*Jvm*.kt', 'app/src/main/java/ru/neurostenographer/app/Offline*.kt']
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Actual ASR, embeddings, global clustering and known-mixture regression
        run: python3 tools/run_host_inference.py
      - name: Verify actual JSON/SRT/TXT intervals and text independently
        if: always()
        run: |
          python3 tools/verify_transcript_exports.py .local/host-results --output .local/host-results/exports.json
          python3 tools/test_transcript_exports.py .local/host-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-jni-evidence-no-audio-or-models
          path: .local/host-results/*.json
