name: Android debug APK and core tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Show preinstalled SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test core and assemble debug APK
        run: gradle --no-daemon :core:runCoreTests :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: neurostenographer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
