name: Android emulator smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK tools on path
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)
          test -n "$SDKMGR" && test -x "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify pinned sherpa-onnx runtime
        run: python3 tools/provision_asr.py
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          script: |
            gradle --no-daemon :app:assembleDebug
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n ru.neurostenographer.app/.MainActivity
            sleep 8
            adb shell pidof ru.neurostenographer.app
            adb shell screencap -p /sdcard/smoke.png
            adb pull /sdcard/smoke.png screenshot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshot
          path: screenshot.png
          if-no-files-found: ignore
