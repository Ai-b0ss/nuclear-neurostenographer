name: Maximum-length recording stress (x86_64)
on:
  workflow_dispatch:
  push:
    branches: ['feature/long-recordings']
    paths: ['app/**', 'core/**', 'tools/run_long_recording.sh', '.github/workflows/long-recording.yml']
permissions:
  contents: read
  actions: read
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)
          test -n "$SDKMGR" && test -x "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Provision checksum-verified public models and fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/provision_asr.py --test-assets
          python3 tools/provision_diarization.py --test-assets
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 4096M
          script: bash tools/run_long_recording.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: long-recording-evidence
          path: |
            device-evidence/
            app/build/reports/androidTests/
