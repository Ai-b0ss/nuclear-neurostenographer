name: Processing layout emulator QA
on:
  workflow_dispatch:
  push:
    branches: ['qa/processing-layout-emulator']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare build tools and pinned runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
          python tools/provision_asr.py
          python3 -m unittest discover -s tools -p test_processing_layout_qa.py -v
          gradle --no-daemon --max-workers=2 -PlayoutQa=true -Prealtime=false :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -accel on
          disable-animations: true
          script: |
            emulator -accel-check
            python tools/run_processing_layout_qa.py --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: processing-layout-ui-only
          path: .local/qa-processing-layout-current/
          retention-days: 7
          if-no-files-found: ignore
