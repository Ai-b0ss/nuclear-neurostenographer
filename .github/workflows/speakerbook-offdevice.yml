name: Speakerbook off-device QA (C2 + TitaNet)
on:
  workflow_dispatch:
    inputs:
      long:
        description: Run the 20m40s continuous fixture in the emulator
        type: boolean
        default: true
  push:
    branches: ['main', 'qa/speakerbook-three-gates-20261112', 'research/titanet-rejections-20261112', 'research/dual-anchor-20261112']
    paths: ['.github/run-speakerbook-offdevice.txt']
permissions:
  contents: read
  actions: read
concurrency:
  group: speakerbook-offdevice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed host evaluation dependencies
        run: pip install numpy==1.26.4 scipy==1.14.1 soundfile==0.13.1 sherpa-onnx==1.12.40
      - name: Test emulator isolation and result acceptance
        run: |
          python -m unittest discover -s tools -p test_speakerbook_offdevice.py -v
          python -m unittest discover -s tools -p test_titanet_diagnosis.py -v
          python -m unittest discover -s tools -p test_dual_anchor_policy.py -v
      - name: Fetch frozen public Russian sample and checksum-pinned models
        run: python tools/provision_speakerbook_qa.py --host
      - name: Run actual product C2 and TitaNet (not a phone test)
        run: |
          python tools/run_speakerbook_host_qa.py \
            --data .local/speakerbook-active/scratch/ru_book_mix_eval \
            --model .local/nemotron \
            --titanet .local/speakerbook-active/scratch/models/nemo_en_titanet_small.onnx \
            --harness .local/speakerbook-host-harness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speakerbook-host-metrics-no-audio-or-embeddings
          retention-days: 7
          include-hidden-files: true
          path: .local/speakerbook-offdevice-current/host/*.json
  emulator:
    name: emulator-${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON((github.event_name == 'workflow_dispatch' && !inputs.long) && '["repeat","differentSources","withoutModel"]' || '["repeat","differentSources","withoutModel","long"]') }}
    # Deliberate host-only reruns must not repeat unchanged Android endurance.
    if: github.event.repository.private == false && !contains(github.event.head_commit.message, '[speakerbook-host-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare SDK
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" -type f | sort -V | tail -n 1)
          test -n "$SDKMGR" && test -x "$SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Provision exact product A3, C2 and TitaNet plus public fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install numpy==1.26.4 soundfile==0.13.1 onnx==1.17.0
          python tools/provision_speakerbook_qa.py --android
      - name: Build isolated fresh speakerbook QA APKs
        run: |
          gradle --no-daemon --max-workers=2 \
            -PnemotronProduct=true -PasrA3=true -PglobalSpeakerBook=true -Prealtime=false \
            :core:runCoreTests :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Require hardware acceleration on this ephemeral runner
        run: |
          test -c /dev/kvm
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          sudo chmod 600 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_CASE: ${{ matrix.mode }}
          RUN_LONG: ${{ github.event_name != 'workflow_dispatch' || inputs.long }}
        with:
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 6144M
          script: bash tools/run_speakerbook_emulator_ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speakerbook-emulator-${{ matrix.mode }}-metadata-NOT-HONOR-performance
          retention-days: 7
          include-hidden-files: true
          path: |
            .local/speakerbook-offdevice-current/emulator/*.json
            .local/speakerbook-offdevice-current/fixtures/fixtures.json
